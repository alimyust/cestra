joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    # Left stick: vertical -> linear.x, horizontal -> linear.y
    axis_linear:
      x: 1
      y: 0

    scale_linear:
      x: 0.5
      y: 0.5
    scale_linear_turbo:
      x: 1.0
      y: 1.0

    # Disable angular output (no angular.z)
    scale_angular:
      yaw: 0.0
    scale_angular_turbo:
      yaw: 0.0

    require_enable_button: true
    enable_button: 6
    enable_turbo_button: 7
